## ICamera (libcamhal) SPA source: WirePlumber drop-in
## Adds the api.icamera spa factory mapping, the icamera monitor components,
## and enables monitor.icamera in the main profile.
##
## Install to /usr/share/wireplumber/wireplumber.conf.d/51-icamera.conf
## (or a user override under ~/.config/wireplumber/wireplumber.conf.d/).
##
## Also disables the v4l2 and libcamera video camera monitors so that
## applications only see the icamera (CamHAL/IPU6) sources.

context.spa-libs = {
  api.icamera.* = icamera/libspa-icamera
}

wireplumber.components = [
  {
    name = monitors/icamera/name-node.lua, type = script/lua
    provides = hooks.monitor.icamera-name-node
  }
  {
    name = monitors/icamera/create-node.lua, type = script/lua
    provides = hooks.monitor.icamera-create-node
    requires = [ support.export-core,
                 pw.client-node,
                 pw.node-factory.spa ]
  }
  {
    name = monitors/icamera/enumerate-device.lua, type = script/lua
    provides = monitor.icamera
    requires = [ support.export-core,
                 support.standard-event-source,
                 hooks.monitor.icamera-create-node ]
    wants = [ hooks.monitor.icamera-name-node ]
  }
  {
    type = virtual, provides = hardware.video-capture
    wants = [ monitor.v4l2, monitor.libcamera, monitor.icamera ]
  }
]

## Disable the v4l2 and libcamera video-camera monitors in the "main" profile.
## A feature set to "disabled" will NOT be loaded, even if some other component
## (e.g. hardware.video-capture) wants it.
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
    monitor.libcamera = disabled
  }
}
